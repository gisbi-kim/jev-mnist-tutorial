<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc"><title id="title">Decision head와 학습 신호</title><desc id="desc">hidden states를 memory로 투영하고 질문과 선택지 표현으로 query를 구성한다. routing과 decoder를 거쳐 logit을 계산한다. 정답은 cross entropy에만 사용한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d98"/></marker></defs><rect width="760" height="1000" fill="#fff"/><g font-family="Malgun Gothic,Segoe UI,sans-serif" fill="#304557"><text x="30" y="36" font-size="24" fill="#304557" font-weight="600" text-anchor="start">Decision head 내부와 학습 신호</text><text x="30" y="67" font-size="18" fill="#657583" font-weight="400" text-anchor="start">주요 연산만 표시한 개략도 · 선택지는 −1, 0, +1</text><rect x="30" y="90" width="300" height="113" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="180" y="122" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">전체 hidden states</text><text x="180" y="155" font-size="19" fill="#304557" font-weight="400" text-anchor="middle">정규화 + projection</text><text x="180" y="185" font-size="19" fill="#304557" font-weight="400" text-anchor="middle">memory: L × 512</text><rect x="350" y="90" width="380" height="113" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="540" y="122" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">질문·선택지 표현</text><text x="540" y="154" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">span 평균 + 선택지 embedding</text><text x="540" y="185" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">projection → 선택지별 query</text><path d="M540 203 V234" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 203 V275 H291" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="238" width="435" height="85" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="512" y="272" font-size="21" fill="#277458" font-weight="600" text-anchor="middle">Evidence routing · 2층</text><text x="512" y="302" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">각 선택지 query가 memory에서 정보 수집</text><path d="M512 323 V358" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="362" width="435" height="114" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="512" y="396" font-size="20" fill="#277458" font-weight="600" text-anchor="middle">질문 표현 결합 + decoder · 4층</text><text x="512" y="429" font-size="17" fill="#304557" font-weight="400" text-anchor="middle">선택지 요약 · 마지막 token · 질문 타입</text><text x="512" y="458" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">memory를 참조해 field 표현 계산</text><path d="M180 275 V419 H291" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><text x="78" y="374" font-size="18" fill="#657583" font-weight="400" text-anchor="start">memory</text><path d="M512 476 V510" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="514" width="625" height="83" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="417" y="547" font-size="22" fill="#277458" font-weight="600" text-anchor="middle">선택지 점수 계산 → logit 3개</text><text x="417" y="577" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">lexical prior + gated (cosine score + residual)</text><path d="M417 597 V632" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="636" width="625" height="73" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="417" y="667" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">예시: z = [−1, 0, 2] → softmax(z)</text><text x="417" y="695" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">p = [0.042, 0.114, 0.844]   (순서: −1, 0, +1)</text><path d="M260 709 V746" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M565 709 V746" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="750" width="350" height="86" rx="5" fill="#eef4fa" stroke="#98b6cc"/><text x="205" y="784" font-size="19" fill="#316d98" font-weight="600" text-anchor="middle">추론: 가장 큰 확률의 행동 선택</text><text x="205" y="815" font-size="23" fill="#316d98" font-weight="600" text-anchor="middle">argmax → +1</text><rect x="400" y="750" width="330" height="86" rx="5" fill="#fff6ee" stroke="#c89d7d"/><text x="565" y="784" font-size="19" fill="#a85e30" font-weight="600" text-anchor="middle">학습: 정답 a*=+1과 비교</text><text x="565" y="815" font-size="21" fill="#a85e30" font-weight="600" text-anchor="middle">L = −ln(0.844) ≈ 0.170</text><path d="M565 836 V871" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="90" y="875" width="640" height="75" rx="5" fill="#fff6ee" stroke="#c89d7d"/><text x="410" y="907" font-size="21" fill="#a85e30" font-weight="600" text-anchor="middle">backward → LoRA와 decision head 갱신</text><text x="410" y="936" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">정답은 loss에만 사용 · 기반 가중치는 고정</text><text x="380" y="982" font-size="17" fill="#657583" font-weight="400" text-anchor="middle">점수·확률·loss는 계산 설명용 예시이며, 저장된 실험 결과가 아니다.</text></g></svg>