<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" role="img" aria-labelledby="title desc"><title id="title">Decision head and training signal</title><desc id="desc">Hidden states are projected into memory; question and choice representations form queries. Routing and the decoder produce logits. Targets are used only for cross-entropy loss.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d98"/></marker></defs><rect width="760" height="1000" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#304557"><text x="30" y="36" font-size="24" fill="#304557" font-weight="600" text-anchor="start">Inside the decision head: training signals</text><text x="30" y="67" font-size="18" fill="#657583" font-weight="400" text-anchor="start">Main operations only · Choices: −1, 0, +1</text><rect x="30" y="90" width="300" height="113" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="180" y="122" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">All hidden states</text><text x="180" y="155" font-size="17" fill="#304557" font-weight="400" text-anchor="middle">Normalize + project</text><text x="180" y="185" font-size="17" fill="#304557" font-weight="400" text-anchor="middle">memory: L × 512</text><rect x="350" y="90" width="380" height="113" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="540" y="122" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">Question / choice representations</text><text x="540" y="154" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Span means + choice embeddings</text><text x="540" y="185" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Projection → query per choice</text><path d="M540 203 V234" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M180 203 V275 H291" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="238" width="435" height="85" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="512" y="272" font-size="21" fill="#277458" font-weight="600" text-anchor="middle">Evidence routing · 2 layers</text><text x="512" y="302" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Each choice query reads from memory</text><path d="M512 323 V358" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="295" y="362" width="435" height="114" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="512" y="396" font-size="20" fill="#277458" font-weight="600" text-anchor="middle">Question fusion + decoder · 4 layers</text><text x="512" y="429" font-size="17" fill="#304557" font-weight="400" text-anchor="middle">Choice summary · last token · question type</text><text x="512" y="458" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Attend to memory → field representation</text><path d="M180 275 V419 H291" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><text x="78" y="374" font-size="18" fill="#657583" font-weight="400" text-anchor="start">memory</text><path d="M512 476 V510" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="514" width="625" height="83" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="417" y="547" font-size="22" fill="#277458" font-weight="600" text-anchor="middle">Score each choice → 3 logits</text><text x="417" y="577" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">lexical prior + gated (cosine score + residual)</text><path d="M417 597 V632" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="105" y="636" width="625" height="73" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="417" y="667" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">Example: z = [−1, 0, 2] → softmax(z)</text><text x="417" y="695" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">p = [0.042, 0.114, 0.844]   (order: −1, 0, +1)</text><path d="M260 709 V746" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M565 709 V746" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="750" width="350" height="86" rx="5" fill="#eef4fa" stroke="#98b6cc"/><text x="205" y="784" font-size="17" fill="#316d98" font-weight="600" text-anchor="middle">Inference: choose highest probability</text><text x="205" y="815" font-size="23" fill="#316d98" font-weight="600" text-anchor="middle">argmax → +1</text><rect x="400" y="750" width="330" height="86" rx="5" fill="#fff6ee" stroke="#c89d7d"/><text x="565" y="784" font-size="17" fill="#a85e30" font-weight="600" text-anchor="middle">Training: compare with target a*=+1</text><text x="565" y="815" font-size="21" fill="#a85e30" font-weight="600" text-anchor="middle">L = −ln(0.844) ≈ 0.170</text><path d="M565 836 V871" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="90" y="875" width="640" height="75" rx="5" fill="#fff6ee" stroke="#c89d7d"/><text x="410" y="907" font-size="21" fill="#a85e30" font-weight="600" text-anchor="middle">Backward → update LoRA and decision head</text><text x="410" y="936" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Targets used only in loss · Base weights frozen</text><text x="380" y="982" font-size="16" fill="#657583" font-weight="400" text-anchor="middle">Illustrative scores, probabilities, and loss; not recorded experiment results.</text></g></svg>
