<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc"><title id="title">입력에서 행동까지</title><desc id="desc">이미지와 영어 state, 질문을 VLM이 함께 처리한다. VLM 내부 LoRA와 decision head를 학습하며, 행동은 선택지 점수의 최댓값으로 정한다.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d98"/></marker></defs><rect width="760" height="1080" fill="#fff"/><g font-family="Malgun Gothic,Segoe UI,sans-serif" fill="#304557"><text x="30" y="35" font-size="24" fill="#304557" font-weight="600" text-anchor="start">입력 → 표현 계산 → 선택지 점수 → 행동</text><text x="30" y="66" font-size="17" fill="#657583" font-weight="400" text-anchor="start">회색: 고정된 기반 가중치  ·  초록색: 학습하는 부분</text><rect x="30" y="90" width="170" height="172" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="48" y="117" font-size="20" fill="#304557" font-weight="600" text-anchor="start">이미지</text><image x="77" y="134" width="76" height="76" href="data:image/png;base64,"/><text x="115" y="243" font-size="17" fill="#657583" font-weight="400" text-anchor="middle">픽셀로 전달</text><rect x="216" y="90" width="514" height="172" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="234" y="118" font-size="20" fill="#304557" font-weight="600" text-anchor="start">영어 state + questions</text><text x="234" y="153" font-size="21" fill="#304557" font-weight="400" text-anchor="start">The current number is 3.</text><text x="234" y="187" font-size="17" fill="#304557" font-weight="400" text-anchor="start">Read the handwritten target digit in the image.</text><text x="234" y="215" font-size="17" fill="#304557" font-weight="400" text-anchor="start">Choose exactly one operation …</text><text x="234" y="243" font-size="18" fill="#304557" font-weight="400" text-anchor="start">선택지: −1 / 0 (STOP) / +1</text><path d="M115 262 V285 H380 V307" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M473 262 V285 H380" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="310" width="580" height="82" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="380" y="342" font-size="22" fill="#304557" font-weight="600" text-anchor="middle">Processor · tokenizer</text><text x="380" y="372" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">이미지 tensor · token ID · mask · 질문/선택지 위치</text><path d="M380 392 V423" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="426" width="700" height="260" rx="5" fill="#fafbfc" stroke="#cdd7de"/><text x="50" y="459" font-size="23" fill="#304557" font-weight="600" text-anchor="start">Qwen3.5-0.8B</text><rect x="50" y="482" width="210" height="77" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="155" y="512" font-size="20" fill="#304557" font-weight="600" text-anchor="middle">Vision encoder</text><text x="155" y="541" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">이미지 특징</text><path d="M260 521 H292" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="296" y="482" width="414" height="144" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="316" y="512" font-size="21" fill="#304557" font-weight="600" text-anchor="start">Language / text backbone</text><text x="316" y="544" font-size="18" fill="#304557" font-weight="400" text-anchor="start">이미지 특징과 텍스트를 함께 처리</text><rect x="316" y="561" width="373" height="47" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="502" y="591" font-size="19" fill="#277458" font-weight="600" text-anchor="middle">내부 projection에 LoRA 추가</text><text x="380" y="662" font-size="20" fill="#304557" font-weight="400" text-anchor="middle">출력: 각 token의 hidden state  H ∈ ℝᴸ×¹⁰²⁴</text><path d="M380 686 V720" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="724" width="580" height="95" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="380" y="757" font-size="23" fill="#277458" font-weight="600" text-anchor="middle">Decision head</text><text x="380" y="789" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">H + 질문/선택지 위치 + 선택지 token embedding</text><path d="M380 819 V852" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="856" width="580" height="80" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="380" y="888" font-size="22" fill="#304557" font-weight="600" text-anchor="middle">선택지별 logit → 확률 → argmax</text><text x="380" y="918" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">예시: p(−1)=4.2% · p(0)=11.4% · p(+1)=84.4%</text><path d="M380 936 V966" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="970" width="580" height="58" rx="5" fill="#eef4fa" stroke="#98b6cc"/><text x="380" y="1007" font-size="19" fill="#316d98" font-weight="600" text-anchor="middle">행동 +1 → 실행 코드가 현재 숫자를 3에서 4로 변경</text><text x="380" y="1058" font-size="17" fill="#657583" font-weight="400" text-anchor="middle">확률은 설명용 예시(T=1)이다. 실제 모델 예측값이 아니다.</text></g></svg>