<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1080" role="img" aria-labelledby="title desc"><title id="title">From inputs to actions</title><desc id="desc">The VLM jointly processes the image, English state, and questions. LoRA inside the VLM and the decision head are trained. The action is selected by the highest choice score.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d98"/></marker></defs><rect width="760" height="1080" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#304557"><text x="30" y="35" font-size="24" fill="#304557" font-weight="600" text-anchor="start">Inputs → representations → choice scores → action</text><text x="30" y="66" font-size="17" fill="#657583" font-weight="400" text-anchor="start">Gray: frozen base weights · Green: trainable components</text><rect x="30" y="90" width="170" height="172" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="48" y="117" font-size="20" fill="#304557" font-weight="600" text-anchor="start">Image</text><image x="77" y="134" width="76" height="76" href="data:image/png;base64,"/><text x="115" y="243" font-size="17" fill="#657583" font-weight="400" text-anchor="middle">Input as pixels</text><rect x="216" y="90" width="514" height="172" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="234" y="118" font-size="20" fill="#304557" font-weight="600" text-anchor="start">English state + questions</text><text x="234" y="153" font-size="21" fill="#304557" font-weight="400" text-anchor="start">The current number is 3.</text><text x="234" y="187" font-size="17" fill="#304557" font-weight="400" text-anchor="start">Read the handwritten target digit in the image.</text><text x="234" y="215" font-size="17" fill="#304557" font-weight="400" text-anchor="start">Choose exactly one operation …</text><text x="234" y="243" font-size="18" fill="#304557" font-weight="400" text-anchor="start">Choices: −1 / 0 (STOP) / +1</text><path d="M115 262 V285 H380 V307" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M473 262 V285 H380" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="310" width="580" height="82" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="380" y="342" font-size="22" fill="#304557" font-weight="600" text-anchor="middle">Processor · tokenizer</text><text x="380" y="372" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Image tensors · token IDs · masks · question/choice spans</text><path d="M380 392 V423" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="426" width="700" height="260" rx="5" fill="#fafbfc" stroke="#cdd7de"/><text x="50" y="459" font-size="23" fill="#304557" font-weight="600" text-anchor="start">Qwen3.5-0.8B</text><rect x="50" y="482" width="210" height="77" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="155" y="512" font-size="20" fill="#304557" font-weight="600" text-anchor="middle">Vision encoder</text><text x="155" y="541" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Image features</text><path d="M260 521 H292" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="296" y="482" width="414" height="144" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="316" y="512" font-size="21" fill="#304557" font-weight="600" text-anchor="start">Language / text backbone</text><text x="316" y="544" font-size="18" fill="#304557" font-weight="400" text-anchor="start">Joint image and text processing</text><rect x="316" y="561" width="373" height="47" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="502" y="591" font-size="19" fill="#277458" font-weight="600" text-anchor="middle">LoRA in internal projections</text><text x="380" y="662" font-size="20" fill="#304557" font-weight="400" text-anchor="middle">Output: hidden state per token  H ∈ ℝᴸ×¹⁰²⁴</text><path d="M380 686 V720" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="724" width="580" height="95" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="380" y="757" font-size="23" fill="#277458" font-weight="600" text-anchor="middle">Decision head</text><text x="380" y="789" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">H + question/choice spans + choice token embeddings</text><path d="M380 819 V852" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="856" width="580" height="80" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="380" y="888" font-size="22" fill="#304557" font-weight="600" text-anchor="middle">Choice logits → probabilities → argmax</text><text x="380" y="918" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">Example: p(−1)=4.2% · p(0)=11.4% · p(+1)=84.4%</text><path d="M380 936 V966" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="90" y="970" width="580" height="58" rx="5" fill="#eef4fa" stroke="#98b6cc"/><text x="380" y="1007" font-size="19" fill="#316d98" font-weight="600" text-anchor="middle">Action +1 → execution code updates the number: 3 → 4</text><text x="380" y="1058" font-size="17" fill="#657583" font-weight="400" text-anchor="middle">Illustrative probabilities (T=1), not actual model predictions.</text></g></svg>
