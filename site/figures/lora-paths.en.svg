<svg xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" role="img" aria-labelledby="title desc"><title id="title">LoRA adds an update to the base computation</title><desc id="desc">Input x passes through frozen W and trainable A and B along two paths, which are added together. LoRA is not a separate stage after the VLM.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#316d98"/></marker></defs><rect width="760" height="490" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif" fill="#304557"><text x="30" y="37" font-size="23" fill="#304557" font-weight="600" text-anchor="start">Inside one VLM projection</text><text x="30" y="69" font-size="18" fill="#657583" font-weight="400" text-anchor="start">Example dimensions: input 1024 → output 1024, rank r=16</text><rect x="30" y="206" width="100" height="66" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="80" y="246" font-size="21" fill="#304557" font-weight="600" text-anchor="middle">Input x</text><path d="M130 239 H160 V137 H261" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M160 239 V343 H201" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="265" y="102" width="235" height="70" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="382" y="130" font-size="20" fill="#304557" font-weight="600" text-anchor="middle">Base W · frozen</text><text x="382" y="156" font-size="18" fill="#657583" font-weight="400" text-anchor="middle">1024 × 1024</text><rect x="205" y="309" width="125" height="70" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="267" y="337" font-size="21" fill="#277458" font-weight="600" text-anchor="middle">A · train</text><text x="267" y="364" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">1024 → 16</text><path d="M330 344 H363" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="367" y="309" width="125" height="70" rx="5" fill="#eaf5ee" stroke="#74a98c"/><text x="429" y="337" font-size="21" fill="#277458" font-weight="600" text-anchor="middle">B · train</text><text x="429" y="364" font-size="18" fill="#304557" font-weight="400" text-anchor="middle">16 → 1024</text><path d="M500 137 H570 V210" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><path d="M492 344 H570 V266" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><text x="504" y="299" font-size="17" fill="#277458" font-weight="400" text-anchor="start">× α/r</text><circle cx="570" cy="239" r="26" fill="#fff" stroke="#98b6cc"/><text x="570" y="247" font-size="27" fill="#316d98" font-weight="600" text-anchor="middle">+</text><path d="M596 239 H632" fill="none" stroke="#316d98" stroke-width="2" marker-end="url(#arrow)"/><rect x="636" y="206" width="94" height="66" rx="5" fill="#f6f8fa" stroke="#cdd7de"/><text x="683" y="246" font-size="20" fill="#304557" font-weight="600" text-anchor="middle">Output y</text><text x="380" y="431" font-size="26" fill="#304557" font-weight="600" text-anchor="middle">y = Wx + (α/r) B(Ax)</text><text x="380" y="468" font-size="18" fill="#657583" font-weight="400" text-anchor="middle">Here α=r=16, so α/r=1.</text></g></svg>
